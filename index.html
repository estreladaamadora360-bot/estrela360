<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrela360 Pro</title>
    <style>
        :root {
            --primary-green: #008751;
            --primary-red: #D22630;
            --bg-dark: #070709;
            --card-bg: rgba(22, 22, 28, 0.8);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-light: #FFFFFF;
            --text-muted: #A5A5B5;
        }

        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top right, rgba(0, 135, 81, 0.15), transparent 300px),
                              radial-gradient(circle at top left, rgba(210, 38, 48, 0.15), transparent 300px);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* ECRÃ DE BOAS-VINDAS */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #070709; z-index: 99999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: opacity 0.5s ease, visibility 0.5s;
        }
        .splash-logo { font-size: 50px; animation: pulse 1.5s infinite ease-in-out; }
        .splash-title { font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: -1px; margin-top: 15px; background: linear-gradient(180deg, #FFFFFF 0%, #B5B5B5 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .splash-subtitle { font-size: 11px; color: var(--primary-green); text-transform: uppercase; letter-spacing: 2px; font-weight: 800; margin-top: 5px; }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.8; } }

        header { padding: 30px 20px 15px 20px; text-align: center; border-bottom: 1px solid var(--card-border); position: relative; }
        header::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, var(--primary-green) 0%, #FFFFFF 50%, var(--primary-red) 100%); }
        header h1 { margin: 0; font-size: 34px; font-weight: 900; letter-spacing: -1.5px; text-transform: uppercase; background: linear-gradient(180deg, #FFFFFF 0%, #B5B5B5 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { margin: 4px 0 0 0; font-size: 11px; color: var(--primary-green); text-transform: uppercase; letter-spacing: 2px; font-weight: 800; }

        nav { display: flex; justify-content: space-between; background: rgba(13, 13, 16, 0.95); backdrop-filter: blur(20px); padding: 8px 4px; position: sticky; top: 0; z-index: 999; border-bottom: 1px solid var(--card-border); }
        nav button { background: none; border: none; color: var(--text-muted); font-size: 11px; font-weight: 800; cursor: pointer; padding: 10px 6px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.2px; flex-grow: 1; text-align: center; }
        nav button.active { color: #FFFFFF; background: linear-gradient(135deg, var(--primary-green) 0%, rgba(0, 135, 81, 0.4) 100%); box-shadow: 0 4px 10px rgba(0, 135, 81, 0.25); }

        .container { padding: 20px; max-width: 600px; margin: 0 auto; padding-bottom: 80px; }
        .app-section { display: none; }
        .app-section.active { display: block; }
        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 22px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .section-title { font-size: 20px; font-weight: 800; margin: 10px 0 20px 0; border-left: 4px solid var(--primary-red); padding-left: 10px; }

        .news-card-modern { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px; overflow: hidden; margin-bottom: 25px; box-shadow: 0 12px 35px rgba(0,0,0,0.5); cursor: pointer; }
        .news-image-banner { height: 160px; background-size: cover; background-position: center; }
        .news-content-area { padding: 20px; }
        .news-tag { display: inline-block; background: var(--primary-red); color: white; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; margin-bottom: 12px; }
        .news-title { font-size: 20px; font-weight: 900; margin: 0 0 10px 0; }
        .news-desc { font-size: 13px; color: var(--text-muted); margin: 0; line-height: 1.5; }

        /* BARRAS DE ANÁLISE */
        .stat-group { margin-bottom: 20px; }
        .stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 8px; display: block; }
        .progress-bg { background: #1a1a1a; height: 12px; border-radius: 6px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 6px; }

        .custom-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(7, 7, 9, 0.98); z-index: 10000; padding: 20px; overflow-y: auto; }
        .modal-close-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.1); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; font-weight: 900; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>
    <div id="splash-screen"><span class="splash-logo">⭐</span><div class="splash-title">Estrela360 Pro</div></div>
    <header><h1>Estrela360</h1><p>A Comunidade Tricolor</p></header>

    <nav>
        <button onclick="irParaSecao('news')" id="btn-news" class="active">Notícias</button>
        <button onclick="irParaSecao('results')" id="btn-results">Resultados</button>
        <button onclick="irParaSecao('squad')" id="btn-squad">Plantel</button>
        <button onclick="irParaSecao('stats')" id="btn-stats">Análises</button>
        <button onclick="irParaSecao('community')" id="btn-comm">Momentos</button>
    </nav>

    <div class="container">
        <section id="news" class="app-section active">
            <div class="news-card-modern" onclick="alert('Cidade Desportiva aprovada: Protocolo assinado na Reboleira.')">
                <div class="news-image-banner" style="background-image: url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=800');"></div>
                <div class="news-content-area"><span class="news-tag" style="background:var(--primary-green)">Infraestrutura</span><h3 class="news-title">Cidade Desportiva aprovada</h3></div>
            </div>
            </section>

        <section id="stats" class="app-section">
            <h2 class="section-title">Análise de Performance</h2>
            <div class="card">
                <div class="stat-group">
                    <span class="stat-label">Valor Mercado SAD</span>
                    <div class="progress-bg"><div class="progress-fill" style="width: 85%; background: var(--primary-green);"></div></div>
                </div>
                <div class="stat-group">
                    <span class="stat-label">Potencial de Subida</span>
                    <div class="progress-bg"><div class="progress-fill" style="width: 90%; background: var(--primary-red);"></div></div>
                </div>
            </div>
        </section>
        </div>
    
    <script>
        // O teu JS original continua aqui, podes colar o que tinhas.
        function irParaSecao(id) {
            document.querySelectorAll('.app-section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
