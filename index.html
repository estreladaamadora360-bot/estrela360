<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrela360 Pro</title>
    <style>
        :root {
            --green: #008751;
            --red: #D22630;
            --dark: #050505;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body { background: var(--dark); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; }

        /* HEADER MODERNO */
        .header-modern {
            padding: 40px 20px;
            text-align: center;
            background: linear-gradient(160deg, var(--green) 0%, var(--dark) 100%);
            border-bottom: 3px solid var(--red);
        }
        .header-modern h1 { font-size: 2.5rem; margin: 0; text-transform: uppercase; letter-spacing: -2px; }

        /* NAVEGAÇÃO 5 ABAS */
        .nav-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            padding: 10px;
            background: #000;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-btn {
            background: var(--glass);
            border: none;
            color: #888;
            padding: 10px 0;
            border-radius: 8px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        .nav-btn.active { background: var(--green); color: white; }

        .content-area { padding: 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <header class="header-modern">
        <h1>ESTRELA360</h1>
    </header>

    <nav class="nav-container">
        <button class="nav-btn active" onclick="mudarTab('noticias', this)">Notícias</button>
        <button class="nav-btn" onclick="mudarTab('plantel', this)">Plantel</button>
        <button class="nav-btn" onclick="mudarTab('analise', this)">Análise</button>
        <button class="nav-btn" onclick="mudarTab('resultados', this)">Resultados</button>
        <button class="nav-btn" onclick="mudarTab('momentos', this)">Momentos</button>
    </nav>

    <div class="content-area">
        <div id="noticias" class="tab-content active"><h2>Notícias</h2></div>
        <div id="plantel" class="tab-content"><h2>Plantel</h2></div>
        <div id="analise" class="tab-content"><h2>Análise</h2></div>
        <div id="resultados" class="tab-content">
            <h2>Resultados</h2>
            <div style="background: rgba(210, 38, 48, 0.1); padding: 15px; border-radius: 10px; border: 1px solid var(--red);">
                ⚠️ Ainda não há calendário definido para a temporada 2026/2027
            </div>
        </div>
        <div id="momentos" class="tab-content"><h2>Momentos</h2></div>
    </div>

    <script>
        function mudarTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }
    </script>
</body>
</html>
