<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrela360 Pro</title>
    <style>
        :root {
            --primary-green: #008751;
            --primary-red: #D22630;
            --bg-dark: #070709;
            --card-bg: rgba(22, 22, 28, 0.8);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-light: #FFFFFF;
            --text-muted: #A5A5B5;
        }

        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
        }

        /* SPLASH SCREEN ATUALIZADO */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #070709;
            z-index: 99999;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        header { padding: 30px 20px 15px 20px; text-align: center; border-bottom: 1px solid var(--card-border); }
        header h1 { margin: 0; font-size: 34px; font-weight: 900; text-transform: uppercase; }
        
        nav { display: flex; background: rgba(13, 13, 16, 0.95); padding: 8px 4px; position: sticky; top: 0; z-index: 999; border-bottom: 1px solid var(--card-border); }
        nav button { background: none; border: none; color: var(--text-muted); font-size: 11px; font-weight: 800; cursor: pointer; padding: 10px 6px; flex-grow: 1; text-transform: uppercase; }
        nav button.active { color: #FFFFFF; background: var(--primary-green); border-radius: 10px; }

        .container { padding: 20px; max-width: 600px; margin: 0 auto; }
        .app-section { display: none; }
        .app-section.active { display: block; }

        /* NOTÍCIAS ESTILO PLANTEL */
        .news-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .news-item:hover { background: rgba(255,255,255,0.05); }

        /* MODAL GERAL (PARA NOTÍCIAS E JOGADORES) */
        .custom-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(7, 7, 9, 0.98); z-index: 10000; padding: 20px; overflow-y: auto;
        }
        .modal-content { max-width: 500px; margin: 40px auto; }
        .modal-close { background: var(--primary-red); border: none; color: white; padding: 10px 20px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <h2>ESTRELA360</h2>
        <p>Bem-vindo à casa Tricolor</p>
    </div>

    <header>
        <h1>Estrela360</h1>
    </header>

    <nav>
        <button onclick="irParaSecao('news')" id="btn-news" class="active">Notícias</button>
        <button onclick="irParaSecao('squad')" id="btn-squad">Plantel</button>
    </nav>

    <div class="container">
        <section id="news" class="app-section active">
            <h2 class="section-title">Notícias</h2>
            <div class="news-item" onclick="abrirModal('Título Notícia 1', 'Texto longo da notícia 1 aqui...')">
                <h3>Revolução de 45M€</h3>
            </div>
        </section>
    </div>

    <div id="modal-geral" class="custom-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="fecharModal()">Fechar</button>
            <h2 id="modal-titulo"></h2>
            <p id="modal-texto"></p>
        </div>
    </div>

    <script>
        // Splash Screen Logic
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';
            }, 2000);
        };

        function irParaSecao(id) {
            document.querySelectorAll('.app-section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function abrirModal(titulo, texto) {
            document.getElementById('modal-titulo').innerText = titulo;
            document.getElementById('modal-texto').innerText = texto;
            document.getElementById('modal-geral').style.display = 'block';
        }

        function fecharModal() {
            document.getElementById('modal-geral').style.display = 'none';
        }
    </script>
</body>
</html>
