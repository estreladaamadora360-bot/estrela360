<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrela360 Pro</title>
    <style>
        :root {
            --tricolor-green: #008751;
            --tricolor-red: #D22630;
            --bg: #050505;
            --card: #0c0c0e;
            --accent: #ffffff;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--accent);
            font-family: 'Inter', system-ui, sans-serif;
            padding-bottom: 100px;
        }

        .header-hero {
            padding: 60px 20px;
            text-align: center;
            background: linear-gradient(180deg, var(--tricolor-green) 0%, var(--bg) 100%);
        }

        .header-hero h1 {
            font-size: 3rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: -2px;
            text-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 20px;
        }

        .btn-nav {
            background: var(--card);
            border: 1px solid #222;
            padding: 15px;
            border-radius: 12px;
            color: #888;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-nav.active {
            border-color: var(--tricolor-red);
            color: white;
        }

        .main-container { padding: 0 20px; }

        .card-modern {
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid var(--tricolor-green);
        }

        .stats-bar {
            height: 10px;
            background: #1a1a1a;
            border-radius: 5px;
            margin: 10px 0;
            overflow: hidden;
        }

        .fill { height: 100%; border-radius: 5px; animation: load 1.5s ease; }

        @keyframes load { from { width: 0; } }

        .tag {
            background: var(--tricolor-red);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="header-hero">
        <h1>ESTRELA360</h1>
        <p>O Coração da Reboleira</p>
    </div>

    <div class="nav-grid">
        <button class="btn-nav active" onclick="show('news')">NOTÍCIAS</button>
        <button class="btn-nav" onclick="show('squad')">PLANTEL</button>
        <button class="btn-nav" onclick="show('performance')">DADOS</button>
    </div>

    <div class="main-container">
        <div id="news" class="content">
            <div class="card-modern">
                <span class="tag">Infraestrutura</span>
                <h2 style="margin: 10px 0;">Cidade Desportiva</h2>
                <p style="color: #aaa;">O projeto da nova casa tricolor já começou a ser desenhado.</p>
            </div>
            <div class="card-modern" style="border-left-color: var(--tricolor-red);">
                <span class="tag">SAD</span>
                <h2 style="margin: 10px 0;">Investimento 45M€</h2>
                <p style="color: #aaa;">Parceria estratégica para elevar o patamar do clube.</p>
            </div>
        </div>

        <div id="performance" class="content" style="display:none;">
            <div class="card-modern">
                <h3>Performance Trimestral</h3>
                <label>Valorização do Plantel</label>
                <div class="stats-bar"><div class="fill" style="width: 85%; background: var(--tricolor-green);"></div></div>
                <label>Evolução Tática</label>
                <div class="stats-bar"><div class="fill" style="width: 92%; background: var(--tricolor-red);"></div></div>
            </div>
        </div>

        <div id="squad" class="content" style="display:none;">
            <div class="card-modern">
                <h3>Plantel Principal</h3>
                <p>Lista técnica em atualização permanente...</p>
            </div>
        </div>
    </div>

    <script>
        function show(id) {
            document.querySelectorAll('.content').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.btn-nav').forEach(b => b.classList.remove('active'));
            document.getElementById(id).style.display = 'block';
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
